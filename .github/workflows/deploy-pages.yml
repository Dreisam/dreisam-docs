name: Deploy Docs to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs
        run: pnpm run build

      - name: Prepare Pages artifact
        run: |
          set -euo pipefail
          mkdir -p pages/sdk pages/sdk-ol
          cp -R apps/sdk/.vitepress/dist/. pages/sdk/
          cp -R apps/sdk-ol/.vitepress/dist/. pages/sdk-ol/
          cat > pages/index.html <<'EOF'
          <!doctype html>
          <html lang="zh-CN">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>Dreisam 文档</title>
              <style>
                :root {
                  color-scheme: light;
                  font-family:
                    Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
                    "Segoe UI", sans-serif;
                  background: #f6f7fb;
                  color: #101828;
                }

                body {
                  margin: 0;
                  min-height: 100vh;
                  display: grid;
                  place-items: center;
                  background:
                    radial-gradient(circle at top, rgba(56, 189, 248, 0.14), transparent 35%),
                    linear-gradient(180deg, #ffffff 0%, #f6f7fb 100%);
                }

                main {
                  width: min(720px, calc(100vw - 48px));
                  padding: 40px;
                  border-radius: 24px;
                  background: rgba(255, 255, 255, 0.88);
                  box-shadow: 0 24px 80px rgba(15, 23, 42, 0.12);
                  backdrop-filter: blur(12px);
                }

                h1 {
                  margin: 0 0 12px;
                  font-size: clamp(2rem, 4vw, 3.25rem);
                  letter-spacing: -0.04em;
                }

                p {
                  margin: 0 0 28px;
                  font-size: 1.05rem;
                  line-height: 1.7;
                  color: #475467;
                }

                .links {
                  display: flex;
                  flex-wrap: wrap;
                  gap: 16px;
                }

                a {
                  display: inline-flex;
                  align-items: center;
                  justify-content: center;
                  min-width: 180px;
                  padding: 14px 20px;
                  border-radius: 999px;
                  text-decoration: none;
                  font-weight: 600;
                  color: white;
                  background: #111827;
                  transition:
                    transform 160ms ease,
                    box-shadow 160ms ease,
                    background 160ms ease;
                }

                a.secondary {
                  color: #111827;
                  background: #e8eef8;
                }

                a:hover {
                  transform: translateY(-1px);
                  box-shadow: 0 16px 32px rgba(17, 24, 39, 0.16);
                }
              </style>
            </head>
            <body>
              <main>
                <h1>Dreisam 文档</h1>
                <p>选择下面的入口进入对应文档站点。</p>
                <div class="links">
                  <a href="./sdk/">标准 SDK 文档</a>
                  <a class="secondary" href="./sdk-ol/">增强 SDK 文档</a>
                </div>
              </main>
            </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
